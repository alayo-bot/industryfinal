<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Awareness</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Serif+4:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #111;
  color: #fff;
  font-family: 'Source Serif 4', Georgia, serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3rem 1.5rem;
}

.wrap { max-width: 540px; }

.label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: #CC2200;
  margin-bottom: 1.4rem;
  opacity: 0;
  animation: up 0.5s ease 0.1s forwards;
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.8rem, 9vw, 5.5rem);
  letter-spacing: 0.06em;
  line-height: 0.95;
  color: #fff;
  margin-bottom: 1.4rem;
  opacity: 0;
  animation: up 0.5s ease 0.25s forwards;
}

h1 span { color: #CC2200; }

.rule {
  width: 40px;
  height: 2px;
  background: #CC2200;
  margin: 0 auto 1.4rem;
  opacity: 0;
  animation: up 0.5s ease 0.4s forwards;
}

p {
  font-size: clamp(0.9rem, 2vw, 1.05rem);
  font-style: italic;
  color: #888;
  line-height: 1.85;
  opacity: 0;
  animation: up 0.5s ease 0.55s forwards;
}

@keyframes up {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

</style>
</head>
<body>
<div class="wrap">
  <div class="label">Emergency Management Awareness</div>
  <h1>Disasters<br>Don't <span>Wait.</span></h1>
  <div class="rule"></div>
  <p>Understanding emergency management — and the maps that guide it — is the first step toward a safer, more prepared community. Stay informed. Stay ready.</p>
</div>
</body>
</html>
